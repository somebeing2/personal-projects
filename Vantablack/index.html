<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vantablack</title>
  <meta name="theme-color" content="#000000" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000; /* The darkest black a screen can display */
      overflow: hidden;
      cursor: none;
    }
    body:hover { cursor: default; }
    .fade { transition: opacity 0.6s ease; }
  </style>
</head>
<body class="bg-black text-white select-none">

  <!-- Pure black canvas -->
  <main class="w-full h-full bg-black"></main>

  <!-- Tiny info toggle (barely visible, fades away) -->
  <button id="infoBtn"
          class="fade fixed bottom-4 right-4 text-[10px] uppercase tracking-[0.3em] text-neutral-800 hover:text-neutral-500 bg-transparent border-none outline-none"
          aria-label="About Vantablack">
    ?
  </button>

  <!-- Info panel -->
  <div id="infoPanel"
       class="fade fixed inset-0 flex items-center justify-center bg-black opacity-0 pointer-events-none">
    <div class="max-w-md text-center px-6">
      <h1 class="text-neutral-400 text-sm tracking-[0.4em] uppercase mb-4">Vantablack</h1>
      <p class="text-neutral-600 text-xs leading-relaxed">
        Vantablack absorbs up to 99.965% of visible light. A screen can't truly reproduce it —
        this is <span class="text-neutral-400">#000000</span>, the darkest black your display can show.
        On an OLED screen, these pixels are completely off.
      </p>
      <p class="text-neutral-800 text-[10px] mt-6 tracking-widest uppercase">Press F for fullscreen · Click anywhere to close</p>
    </div>
  </div>

  <script>
    const btn = document.getElementById('infoBtn');
    const panel = document.getElementById('infoPanel');
    let hideTimer;

    function showBtn() {
      btn.style.opacity = '1';
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => (btn.style.opacity = '0'), 2500);
    }
    document.addEventListener('mousemove', showBtn);
    document.addEventListener('touchstart', showBtn);
    showBtn();

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      panel.style.opacity = '1';
      panel.style.pointerEvents = 'auto';
    });

    panel.addEventListener('click', () => {
      panel.style.opacity = '0';
      panel.style.pointerEvents = 'none';
    });

    document.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'f') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      }
      if (e.key === 'Escape') panel.click();
    });
  </script>
</body>
</html>
